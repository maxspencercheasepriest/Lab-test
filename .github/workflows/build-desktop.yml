# Builds the Windows .exe and Mac .dmg on GitHub's own machines, then publishes
# them as a GitHub Release named after the version in package.json (e.g. v1.0.0).
#
# Runs automatically on every push to main, or by hand from the Actions tab
# ("Build desktop apps" → "Run workflow"). Bump "version" in package.json to
# get a new Release instead of updating the existing one.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
            files: dist/*.exe
          - os: macos-latest
            cmd: npm run dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: the-programme-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: The Programme v${{ steps.v.outputs.version }}
          body: |
            **Windows:** download `The-Programme-Setup-${{ steps.v.outputs.version }}.exe` (installer) or the Portable exe.
            SmartScreen will warn because the app isn't code-signed: click **More info → Run anyway**.

            **Mac (Intel + Apple Silicon):** download the `.dmg` and drag the app to Applications.
            On first launch: **System Settings → Privacy & Security → Open Anyway**.

            Host clicks **Create a room**; friends type the host's address and the room code. See the README for internet play.
          files: out/*
          make_latest: true
