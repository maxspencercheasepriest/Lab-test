# Builds the Windows .exe and Mac .dmg on GitHub's own machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1
# to also publish the files as a GitHub Release.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
            files: |
              dist/*.exe
          - os: macos-latest
            cmd: npm run dist:mac
            files: |
              dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: the-programme-${{ matrix.os }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
